openapi: 3.0.3
info:
  title: Real Estate Platform API
  description: |
    Complete API specification for the Real Estate multi-module platform.
    Includes Auth, Property Management, Advertising, Communication, Subscriptions,
    Service Providers, and Ledger modules.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.example.com
    description: Production server

security:
  - bearerAuth: []

paths:
  # ============================================================================
  # AUTH
  # ============================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation error

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (delete all tokens)
      responses:
        '200':
          description: Logged out successfully

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirmation, token]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                token:
                  type: string
      responses:
        '200':
          description: Password reset successful

  /auth/two-factor-challenge:
    post:
      tags: [Auth]
      summary: Complete two-factor challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 2FA code from authenticator app
                recovery_code:
                  type: string
                  description: Recovery code (alternative to code)
      responses:
        '200':
          description: 2FA verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      summary: Verify email address (signed URL from email)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          schema: { type: string }
        - name: signature
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Email verified

  /auth/email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend email verification link
      responses:
        '200':
          description: Verification email resent

  /auth/user/profile-information:
    put:
      tags: [Auth]
      summary: Update user profile information
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated

  /auth/user/password:
    put:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password changed

  /auth/user/confirm-password:
    post:
      tags: [Auth]
      summary: Confirm password before sensitive action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Password confirmed

  /auth/user/two-factor-authentication:
    post:
      tags: [Auth][2FA]
      summary: Enable two-factor authentication
      responses:
        '200':
          description: 2FA enabled (returns QR code & recovery codes via separate endpoints)
    delete:
      tags: [Auth][2FA]
      summary: Disable two-factor authentication
      responses:
        '200':
          description: 2FA disabled

  /auth/user/confirmed-two-factor-authentication:
    post:
      tags: [Auth][2FA]
      summary: Confirm 2FA enablement with code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 2FA confirmed

  /auth/user/two-factor-qr-code:
    get:
      tags: [Auth][2FA]
      summary: Get 2FA QR code (SVG)
      responses:
        '200':
          description: QR code SVG

  /auth/user/two-factor-secret-key:
    get:
      tags: [Auth][2FA]
      summary: Get 2FA secret key
      responses:
        '200':
          description: Secret key string

  /auth/user/two-factor-recovery-codes:
    get:
      tags: [Auth][2FA]
      summary: Get recovery codes
      responses:
        '200':
          description: Array of recovery codes
    post:
      tags: [Auth][2FA]
      summary: Regenerate recovery codes
      responses:
        '200':
          description: New recovery codes

  /user:
    get:
      tags: [Auth]
      summary: Get authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ============================================================================
  # SEARCH
  # ============================================================================
  /search/{type}:
    get:
      tags: [Search]
      summary: Global search across entities
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [properties, offices, ads, categories]
        - name: search
          in: query
          schema:
            type: string
        - name: perPage
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Search results

  # ============================================================================
  # CATEGORIES
  # ============================================================================
  /api/categories/public:
    get:
      tags: [Categories]
      summary: List all categories (public)
      security: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /api/categories/public/{id}:
    get:
      tags: [Categories]
      summary: Get a category (public)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/categories:
    get:
      tags: [Categories]
      summary: List all categories (admin)
      responses:
        '200':
          description: Paginated categories
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created

  /api/categories/{id}:
    get:
      tags: [Categories]
      summary: Get a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Category detail
    put:
      tags: [Categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ============================================================================
  # LOCATION — COUNTRIES
  # ============================================================================
  /api/location/countries:
    get:
      tags: [Location]
      summary: List all countries (public)
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: perPage
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Countries list
    post:
      tags: [Location]
      summary: Create a country (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryInput'
      responses:
        '201':
          description: Created

  /api/location/countries/{id}:
    get:
      tags: [Location]
      summary: Get a country
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Country detail
    put:
      tags: [Location]
      summary: Update a country (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Location]
      summary: Delete a country (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ============================================================================
  # LOCATION — CITIES
  # ============================================================================
  /api/location/cities:
    get:
      tags: [Location]
      summary: List all cities (public)
      security: []
      parameters:
        - name: country_id
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: perPage
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Cities list
    post:
      tags: [Location]
      summary: Create a city (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityInput'
      responses:
        '201':
          description: Created

  /api/location/cities/{id}:
    get:
      tags: [Location]
      summary: Get a city
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: City detail
    put:
      tags: [Location]
      summary: Update a city (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Location]
      summary: Delete a city (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ============================================================================
  # USER MANAGEMENT (ADMIN)
  # ============================================================================
  /api/users:
    get:
      tags: [User Management]
      summary: List all users (admin)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: perPage
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Paginated users
    post:
      tags: [User Management]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created

  /api/users/{id}:
    get:
      tags: [User Management]
      summary: Get a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User detail
    put:
      tags: [User Management]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [User Management]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  /api/users/{id}/toggle-status:
    put:
      tags: [User Management]
      summary: Toggle user active/inactive status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Status toggled

  # ============================================================================
  # ROLE MANAGEMENT (ADMIN)
  # ============================================================================
  /api/roles:
    get:
      tags: [Role Management]
      summary: List all roles
      responses:
        '200':
          description: Roles with permissions
    post:
      tags: [Role Management]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Role created

  /api/roles/{id}:
    get:
      tags: [Role Management]
      summary: Get a role with permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Role detail
    put:
      tags: [Role Management]
      summary: Update a role name
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Updated
    delete:
      tags: [Role Management]
      summary: Delete a role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  /api/roles/{id}/permissions:
    post:
      tags: [Role Management]
      summary: Assign permissions to a role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: string
                  description: Permission strings
      responses:
        '200':
          description: Permissions assigned

  /api/permissions:
    get:
      tags: [Role Management]
      summary: Get all available permissions
      responses:
        '200':
          description: List of all permission strings

  # ============================================================================
  # PUBLISHER PROFILE
  # ============================================================================
  /api/publisher/profile:
    put:
      tags: [Publisher]
      summary: Update publisher profile (name, phone, website, description, etc.)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                website_url:
                  type: string
                  format: uri
                description:
                  type: string
                social_links:
                  type: object
                  description: Key-value social media links
                avatar:
                  type: string
                  description: File ID/path for avatar
      responses:
        '200':
          description: Profile updated

  /api/publisher/contact-preference:
    put:
      tags: [Publisher]
      summary: Update contact preference (chat vs external)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_preference:
                  type: string
                  enum: [chat, external]
      responses:
        '200':
          description: Preference updated

  /api/publisher/statistics:
    get:
      tags: [Publisher]
      summary: Get publisher statistics (property counts, views, favorites)
      responses:
        '200':
          description: Statistics data

  /api/publisher/analytics:
    get:
      tags: [Publisher]
      summary: Get publisher analytics (requires advanced_analytics feature)
      responses:
        '200':
          description: Analytics data

  /api/publisher/upgrade-request:
    post:
      tags: [Publisher]
      summary: Request account upgrade (individual → office)
      responses:
        '201':
          description: Upgrade request submitted

  /api/publisher/upgrade-status:
    get:
      tags: [Publisher]
      summary: Check upgrade request status
      responses:
        '200':
          description: Upgrade status

  # ============================================================================
  # PUBLISHER OFFICES (PUBLIC)
  # ============================================================================
  /api/dashboard/publishers/offices:
    get:
      tags: [Offices]
      summary: List publisher offices (public within dashboard)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: perPage
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Offices list

  /api/dashboard/publishers/offices/{id}:
    get:
      tags: [Offices]
      summary: Get office profile detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Office detail

  # ============================================================================
  # ADMIN — OFFICES & UPGRADE REQUESTS
  # ============================================================================
  /api/admin/offices/{id}/verify:
    post:
      tags: [Admin Offices]
      summary: Verify an office (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Office verified

  /api/admin/offices/{id}/unverify:
    post:
      tags: [Admin Offices]
      summary: Unverify an office (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Office unverified

  /api/admin/office-upgrade-requests:
    get:
      tags: [Admin Offices]
      summary: List pending upgrade requests (admin)
      responses:
        '200':
          description: Upgrade requests list

  /api/admin/upgrade-requests/{id}/approve:
    post:
      tags: [Admin Offices]
      summary: Approve an upgrade request (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Approved

  /api/admin/upgrade-requests/{id}/reject:
    post:
      tags: [Admin Offices]
      summary: Reject an upgrade request (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rejection_reason:
                  type: string
      responses:
        '200':
          description: Rejected

  # ============================================================================
  # REVIEWS
  # ============================================================================
  /api/dashboard/offices/{officeId}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for an office
      parameters:
        - name: officeId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Reviews list

  /api/reviews:
    post:
      tags: [Reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Review submitted

  /api/reviews/{id}:
    delete:
      tags: [Reviews]
      summary: Delete a review (admin or owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Deleted

  # ============================================================================
  # PROPERTIES — PUBLIC
  # ============================================================================
  /api/properties/browse:
    get:
      tags: [Properties]
      summary: Browse public properties with advanced filtering
      security: []
      parameters:
        - name: property_type
          in: query
          schema:
            type: string
            enum: [apartment, house, villa, land, commercial, office, warehouse, other]
        - name: type_of_contract
          in: query
          schema:
            type: string
            enum: [sale, rent]
        - name: country_id
          in: query
          schema: { type: integer }
        - name: city_id
          in: query
          schema: { type: integer }
        - name: price_min
          in: query
          schema: { type: number, minimum: 0 }
        - name: price_max
          in: query
          schema: { type: number, minimum: 0 }
        - name: area_min
          in: query
          schema: { type: number, minimum: 0 }
        - name: area_max
          in: query
          schema: { type: number, minimum: 0 }
        - name: rooms_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: rooms_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: bathrooms_min
          in: query
          schema: { type: integer, minimum: 0 }
        - name: bathrooms_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: search
          in: query
          schema: { type: string }
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [price, area, rooms, bathrooms, created_at, views]
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Paginated properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/properties/random:
    get:
      tags: [Properties]
      summary: Get 10 random approved properties
      security: []
      responses:
        '200':
          description: Random properties

  /api/properties/{id}/details:
    get:
      tags: [Properties]
      summary: Get public property detail
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Property detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'

  # ============================================================================
  # PROPERTIES — DASHBOARD (AUTHENTICATED)
  # ============================================================================
  /api/dashboard/properties:
    get:
      tags: [Dashboard Properties]
      summary: List user's properties (dashboard)
      responses:
        '200':
          description: Paginated properties
    post:
      tags: [Dashboard Properties]
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
