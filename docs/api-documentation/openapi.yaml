openapi: 3.0.3
info:
  title: Real Estate Platform API
  description: 'Complete OpenAPI specification for the Real Estate Platform (Laravel 12 modular monolith).


    Covers 13 modules: Auth, Core, RealEstate, Communication, Subscription, ServiceProvider, Ledger, Deposit, Crm, FileSystem, Statistics, Ai, Map.


    All protected endpoints require `Authorization: Bearer {token}`.'
  version: 2.0.0
  contact:
    name: Real Estate Platform
servers:
- url: http://localhost:8000
  description: Development
tags:
- name: Auth
- name: Search
- name: Users
- name: Roles
- name: Categories
- name: Location
- name: Properties
- name: Appointments
- name: Map
- name: Ads
- name: Sponsored Ads
- name: Chat
- name: Notifications
- name: FCM
- name: Plans
- name: Subscriptions
- name: Stripe
- name: Service Providers
- name: Service Requests
- name: Ledger
- name: Payroll
- name: CRM
- name: Deposits
- name: FileSystem
- name: Storage
- name: Statistics
- name: Market
- name: Admin Statistics
- name: AI
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login and receive Sanctum token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation error
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout (delete all tokens)
      responses:
        '200':
          description: Logged out successfully
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Send password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - password_confirmation
              - token
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                token:
                  type: string
      responses:
        '200':
          description: Password reset successful
  /auth/two-factor-challenge:
    post:
      tags:
      - Auth
      summary: Complete two-factor challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 2FA code from authenticator app
                recovery_code:
                  type: string
                  description: Recovery code (alternative to code)
      responses:
        '200':
          description: 2FA verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/email/verify/{id}/{hash}:
    get:
      tags:
      - Auth
      summary: Verify email address (signed URL from email)
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        schema:
          type: string
      - name: signature
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Email verified
  /auth/email/verification-notification:
    post:
      tags:
      - Auth
      summary: Resend email verification link
      responses:
        '200':
          description: Verification email resent
  /auth/user/profile-information:
    put:
      tags:
      - Auth
      summary: Update user profile information
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated
  /auth/user/password:
    put:
      tags:
      - Auth
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password changed
  /auth/user/confirm-password:
    post:
      tags:
      - Auth
      summary: Confirm password before sensitive action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Password confirmed
  /auth/user/two-factor-authentication:
    post:
      tags:
      - Auth
      - 2FA
      summary: Enable two-factor authentication
      responses:
        '200':
          description: 2FA enabled (returns QR code & recovery codes via separate endpoints)
    delete:
      tags:
      - Auth
      - 2FA
      summary: Disable two-factor authentication
      responses:
        '200':
          description: 2FA disabled
  /auth/user/confirmed-two-factor-authentication:
    post:
      tags:
      - Auth
      - 2FA
      summary: Confirm 2FA enablement with code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 2FA confirmed
  /auth/user/two-factor-qr-code:
    get:
      tags:
      - Auth
      - 2FA
      summary: Get 2FA QR code (SVG)
      responses:
        '200':
          description: QR code SVG
  /auth/user/two-factor-secret-key:
    get:
      tags:
      - Auth
      - 2FA
      summary: Get 2FA secret key
      responses:
        '200':
          description: Secret key string
  /auth/user/two-factor-recovery-codes:
    get:
      tags:
      - Auth
      - 2FA
      summary: Get recovery codes
      responses:
        '200':
          description: Array of recovery codes
    post:
      tags:
      - Auth
      - 2FA
      summary: Regenerate recovery codes
      responses:
        '200':
          description: New recovery codes
  /user:
    get:
      tags:
      - Auth
      summary: Get authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/categories/public:
    get:
      tags:
      - Categories
      summary: List all categories (public)
      security: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /api/categories/public/{id}:
    get:
      tags:
      - Categories
      summary: Get a category (public)
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /api/categories:
    post:
      summary: ''
      operationId: postApiCategories
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                type:
                  type: string
                  description: ''
                  example: property
                  enum:
                  - property
                  - car
              required:
              - name
              - type
  /api/categories/{id}:
    put:
      summary: ''
      operationId: putApiCategoriesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                type:
                  type: string
                  description: ''
                  example: property
                  enum:
                  - property
                  - car
    delete:
      summary: ''
      operationId: deleteApiCategoriesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the category.
      example: architecto
      required: true
      schema:
        type: string
  /api/location/countries:
    post:
      summary: ''
      operationId: postApiLocationCountries
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 128 characters.
                  example: b
                code:
                  type: string
                  description: Must not be greater than 3 characters.
                  example: n
                  nullable: true
                phone_code:
                  type: string
                  description: Must not be greater than 4 characters.
                  example: gzmi
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
              required:
              - name
              - is_active
  /api/location/countries/{id}:
    put:
      summary: ''
      operationId: putApiLocationCountriesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 128 characters.
                  example: b
                code:
                  type: string
                  description: Must not be greater than 3 characters.
                  example: n
                  nullable: true
                phone_code:
                  type: string
                  description: Must not be greater than 4 characters.
                  example: gzmi
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
              required:
              - name
              - is_active
    delete:
      summary: ''
      operationId: deleteApiLocationCountriesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the country.
      example: architecto
      required: true
      schema:
        type: string
  /api/location/cities:
    post:
      summary: ''
      operationId: postApiLocationCities
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 128 characters.
                  example: b
                country_id:
                  type: string
                  description: The <code>id</code> of an existing record in the countries table.
                  example: architecto
                state_provianc:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                postal_code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
                  nullable: true
              required:
              - name
              - country_id
  /api/location/cities/{id}:
    put:
      summary: ''
      operationId: putApiLocationCitiesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 128 characters.
                  example: b
                country_id:
                  type: string
                  description: The <code>id</code> of an existing record in the countries table.
                  example: architecto
                state_provianc:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                postal_code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
              required:
              - name
              - country_id
    delete:
      summary: ''
      operationId: deleteApiLocationCitiesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the city.
      example: architecto
      required: true
      schema:
        type: string
  /api/users:
    post:
      summary: ''
      operationId: postApiUsers
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                email:
                  type: string
                  description: Must be a valid email address.
                  example: zbailey@example.net
                password:
                  type: string
                  description: Must be at least 8 characters.
                  example: -0pBNvYgxw
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                  - active
                  - inactive
                role_ids:
                  type: array
                  description: The <code>id</code> of an existing record in the roles table.
                  example:
                  - 16
                  items:
                    type: integer
              required:
              - name
              - email
              - password
  /api/users/{id}:
    put:
      summary: ''
      operationId: putApiUsersId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                email:
                  type: string
                  description: Must be a valid email address.
                  example: zbailey@example.net
                password:
                  type: string
                  description: Must be at least 8 characters.
                  example: -0pBNvYgxw
                status:
                  type: string
                  description: ''
                  example: inactive
                  enum:
                  - active
                  - inactive
                role_ids:
                  type: array
                  description: The <code>id</code> of an existing record in the roles table.
                  example:
                  - 16
                  items:
                    type: integer
    delete:
      summary: ''
      operationId: deleteApiUsersId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the user.
      example: architecto
      required: true
      schema:
        type: string
  /api/users/{id}/toggle-status:
    put:
      summary: ''
      operationId: putApiUsersIdToggleStatus
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the user.
      example: architecto
      required: true
      schema:
        type: string
  /api/roles:
    post:
      summary: ''
      operationId: postApiRoles
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                guard_name:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                permissions:
                  type: array
                  description: The <code>name</code> of an existing record in the permissions table.
                  example:
                  - architecto
                  items:
                    type: string
              required:
              - name
  /api/roles/{id}:
    put:
      summary: ''
      operationId: putApiRolesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                guard_name:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                permissions:
                  type: array
                  description: The <code>name</code> of an existing record in the permissions table.
                  example:
                  - architecto
                  items:
                    type: string
    delete:
      summary: ''
      operationId: deleteApiRolesId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the role.
      example: architecto
      required: true
      schema:
        type: string
  /api/roles/{id}/permissions:
    post:
      summary: ''
      operationId: postApiRolesIdPermissions
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  description: The <code>name</code> of an existing record in the permissions table.
                  example:
                  - architecto
                  items:
                    type: string
    parameters:
    - in: path
      name: id
      description: The ID of the role.
      example: architecto
      required: true
      schema:
        type: string
  /api/permissions:
    get:
      tags:
      - Role Management
      summary: Get all available permissions
      responses:
        '200':
          description: List of all permission strings
  /api/publisher/profile:
    put:
      summary: ''
      operationId: putApiPublisherProfile
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
  /api/publisher/contact-preference:
    put:
      summary: ''
      operationId: putApiPublisherContactPreference
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
  /api/publisher/statistics:
    get:
      tags:
      - Publisher
      summary: Get publisher statistics (property counts, views, favorites)
      responses:
        '200':
          description: Statistics data
  /api/publisher/analytics:
    get:
      tags:
      - Publisher
      summary: Get publisher analytics (requires advanced_analytics feature)
      responses:
        '200':
          description: Analytics data
  /api/publisher/upgrade-request:
    post:
      summary: ''
      operationId: postApiPublisherUpgradeRequest
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
  /api/publisher/upgrade-status:
    get:
      tags:
      - Publisher
      summary: Check upgrade request status
      responses:
        '200':
          description: Upgrade status
  /api/dashboard/publishers/offices:
    get:
      tags:
      - Offices
      summary: List publisher offices (public within dashboard)
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: perPage
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Offices list
  /api/dashboard/publishers/offices/{id}:
    get:
      tags:
      - Offices
      summary: Get office profile detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Office detail
  /api/admin/offices/{id}/verify:
    post:
      summary: ''
      operationId: postApiAdminOfficesIdVerify
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the office.
      example: architecto
      required: true
      schema:
        type: string
  /api/admin/offices/{id}/unverify:
    post:
      summary: ''
      operationId: postApiAdminOfficesIdUnverify
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the office.
      example: architecto
      required: true
      schema:
        type: string
  /api/admin/office-upgrade-requests:
    get:
      tags:
      - Admin Offices
      summary: List pending upgrade requests (admin)
      responses:
        '200':
          description: Upgrade requests list
  /api/admin/upgrade-requests/{id}/approve:
    post:
      summary: ''
      operationId: postApiAdminUpgradeRequestsIdApprove
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the upgrade request.
      example: architecto
      required: true
      schema:
        type: string
  /api/admin/upgrade-requests/{id}/reject:
    post:
      summary: ''
      operationId: postApiAdminUpgradeRequestsIdReject
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the upgrade request.
      example: architecto
      required: true
      schema:
        type: string
  /api/dashboard/offices/{officeId}/reviews:
    get:
      tags:
      - Reviews
      summary: List reviews for an office
      parameters:
      - name: officeId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Reviews list
  /api/reviews:
    post:
      summary: ''
      operationId: postApiReviews
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
  /api/reviews/{id}:
    delete:
      summary: ''
      operationId: deleteApiReviewsId
      description: ''
      parameters: []
      responses: {}
      tags:
      - Endpoints
    parameters:
    - in: path
      name: id
      description: The ID of the review.
      example: architecto
      required: true
      schema:
        type: string
  /api/properties/browse:
    get:
      tags:
      - Properties
      summary: Browse public properties with advanced filtering
      security: []
      parameters:
      - name: property_type
        in: query
        schema:
          type: string
          enum:
          - apartment
          - house
          - villa
          - land
          - commercial
          - office
          - warehouse
          - other
      - name: type_of_contract
        in: query
        schema:
          type: string
          enum:
          - sale
          - rent
      - name: country_id
        in: query
        schema:
          type: integer
      - name: city_id
        in: query
        schema:
          type: integer
      - name: price_min
        in: query
        schema:
          type: number
          minimum: 0
      - name: price_max
        in: query
        schema:
          type: number
          minimum: 0
      - name: area_min
        in: query
        schema:
          type: number
          minimum: 0
      - name: area_max
        in: query
        schema:
          type: number
          minimum: 0
      - name: rooms_min
        in: query
        schema:
          type: integer
          minimum: 0
      - name: rooms_max
        in: query
        schema:
          type: integer
          minimum: 0
      - name: bathrooms_min
        in: query
        schema:
          type: integer
          minimum: 0
      - name: bathrooms_max
        in: query
        schema:
          type: integer
          minimum: 0
      - name: search
        in: query
