    post:
      summary: Create a new rental card.
      operationId: createANewRentalCard
      description: 'Creates an active rental card for the given property. The property''s

        status is automatically transitioned to `rented`. Either a registered

        tenant (user_id) or an external tenant (name required) must be provided.

        Up to 20 pre-rental photos can be attached (jpeg/png/webp, 5 MB each).'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: Rental card has been created successfully
                  data:
                    id: 1
                    property_id: 5
                    status: active
                    is_renewable: true
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Rental card has been created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      property_id:
                        type: integer
                        example: 5
                      status:
                        type: string
                        example: active
                      is_renewable:
                        type: boolean
                        example: true
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: The given data was invalid.
                  errors:
                    property_id:
                    - '...'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: The given data was invalid.
                  errors:
                    type: object
                    properties:
                      property_id:
                        type: array
                        example:
                        - '...'
                        items:
                          type: string
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: This property is not available for renting.
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: This property is not available for renting.
      tags:
      - Rental Cards
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                property_id:
                  type: integer
                  description: The property ID. Must be owned by the caller and currently `approved`.
                  example: 5
                tenant_user_id:
                  type: integer
                  description: Optional. ID of a registered tenant user.
                  example: 42
                  nullable: true
                external_tenant_name:
                  type: string
                  description: Optional. Required when `tenant_user_id` is omitted.
                  example: John External
                  nullable: true
                external_tenant_phone:
                  type: string
                  description: Optional. Max 32 chars.
                  example: '+966500000000'
                  nullable: true
                external_tenant_email:
                  type: string
                  description: Optional. Must be a valid email.
                  example: john@example.com
                  nullable: true
                external_tenant_id_notes:
                  type: string
                  description: Optional. Free-text identity notes.
                  example: National ID 1234567890
                  nullable: true
                start_date:
                  type: date
                  description: Rental start date (today or later).
                  example: '2026-07-01'
                end_date:
                  type: date
                  description: Rental end date (must be after start_date).
                  example: '2027-01-01'
                terms:
                  type: string
                  description: Optional. Free-text terms (max 5000 chars).
                  example: Monthly rent 3000 SAR
                  nullable: true
                notes:
                  type: string
                  description: Optional. Free-text notes (max 5000 chars).
                  example: Tenant promised to repaint living room
                  nullable: true
                is_renewable:
                  type: boolean
                  description: 'Optional. Whether the card can be renewed. Default: false.'
                  example: true
                  nullable: true
                pre_rental_photos:
                  type: array
                  description: Optional. Up to 20 image files (jpeg/png/webp, 5 MB each).
                  items:
                    type: string
                    format: binary
              required:
              - property_id
              - start_date
              - end_date
