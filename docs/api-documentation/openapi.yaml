# ============================================================================
# COMPONENTS — SCHEMAS
# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token

  schemas:
    # ----- AUTH -----
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              description: Sanctum plain-text API token

    # ----- USER -----
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, inactive]
        publisher_type:
          type: string
          enum: [individual, office]
          nullable: true
        phone:
          type: string
          nullable: true
        website_url:
          type: string
          nullable: true
        social_links:
          type: object
          nullable: true
        description:
          type: string
          nullable: true
        is_verified:
          type: boolean
        employees_count:
          type: integer
          nullable: true
        contact_preference:
          type: string
          enum: [chat, external]
          nullable: true
        average_rating:
          type: number
          format: decimal
          nullable: true
        avatar_url:
          type: string
          nullable: true
        reviews_count:
          type: integer
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum: [active, inactive]
        role_ids:
          type: array
          items:
            type: integer

    UserUpdateInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum: [active, inactive]
        role_ids:
          type: array
          items:
            type: integer

    # ----- ROLE -----
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
        permissions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ----- CATEGORY -----
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string

    # ----- COUNTRY -----
    CountryInput:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
          maxLength: 3
          description: ISO country code (e.g. US, UK)
        phone_code:
          type: string
        is_active:
          type: boolean

    # ----- CITY -----
    CityInput:
      type: object
      required: [name, country_id]
      properties:
        name:
          type: string
        country_id:
          type: integer
        state_province:
          type: string
        postal_code:
          type: string
        is_active:
          type: boolean

    # ----- PROPERTY -----
    Property:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        country_id:
          type: integer
        city_id:
          type: integer
        longitude:
          type: number
          format: double
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        country:
          $ref: '#/components/schemas/Country'
        city:
          $ref: '#/components/schemas/City'
        type_of_contract:
          type: string
          enum: [sale, rent]
        property_type:
          type: string
          enum: [apartment, house, villa, land, commercial, office, warehouse, other]
        rooms:
          type: integer
        bathrooms:
          type: integer
        area:
          type: number
        detailed_info:
          type: string
          nullable: true
        price:
          type: number
        currency:
          type: string
          maxLength: 3
        formatted_price:
          type: string
          description: e.g. "USD 1,234.56"
        status:
          type: string
          enum: [pending, under_inspection, approved, rejected, suspended, sold, archived, draft]
        rejection_reason:
          type: string
          nullable: true
        is_loved:
          type: boolean
          description: Whether current user has favorited this property
        views:
          type: integer
        main_image:
          type: string
          nullable: true
          description: Full image URL
        main_image_thumb:
          type: string
          nullable: true
        gallery:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: integer }
              url: { type: string }
              thumb: { type: string }
              medium: { type: string }
        publisher:
          $ref: '#/components/schemas/User'
        publisher_id:
          type: integer
        publisher_type:
          type: string
        publisher_is_verified:
          type: boolean
        approved_by:
          type: integer
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        is_physically_verified:
          type: boolean
        inspection_requested_at:
          type: string
          format: date-time
          nullable: true
        inspection_completed_at:
          type: string
          format: date-time
          nullable: true
        inspection_score:
          type: number
          nullable: true
        inspection_report:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PropertyInput:
      type: object
      required:
        - name
        - description
        - country_id
        - city_id
        - property_type
        - type_of_contract
        - rooms
        - bathrooms
        - area
        - price
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        country_id:
          type: integer
        city_id:
          type: integer
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        property_type:
          type: string
          enum: [apartment, house, villa, land, commercial, office, warehouse, other]
        type_of_contract:
          type: string
          enum: [sale, rent]
        rooms:
          type: integer
          minimum: 0
        bathrooms:
          type: integer
          minimum: 0
        area:
          type: number
          minimum: 0
        detailed_info:
          type: string
        price:
          type: number
          minimum: 0
        currency:
          type: string
          maxLength: 3
          default: USD
        main_image:
          type: object
          properties:
            id:
              type: integer
            temporary_folder:
              type: string
        gallery:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              temporary_folder:
                type: string

    # ----- COUNTRY (RESPONSE) -----
    Country:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        phone_code:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ----- CITY (RESPONSE) -----
    City:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country_id:
          type: integer
        state_province:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        is_active:
          type: boolean
        country:
          $ref: '#/components/schemas/Country'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ----- VIEWING -----
    ViewingInput:
      type: object
      required: [property_id, scheduled_at]
      properties:
        property_id:
          type: integer
        scheduled_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 15
          maximum: 240
          default: 60
        buffer_minutes:
          type: integer
          minimum: 0
          maximum: 60
        viewing_type:
          type: string
          enum: [in_person, virtual, open_house]
        contact_name:
          type: string
          maxLength: 255
        contact_phone:
          type: string
          maxLength: 30
        notes:
          type: string
          maxLength: 1000
        max_attendees:
          type: integer
          minimum: 1
          maximum: 50

    # ----- AD -----
    AdInput:
      type: object
      required: [title, media_type]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        ad_group_id:
          type: integer
        media_type:
          type: string
          enum: [video, image]
        external_url:
          type: string
          format: uri
        property_id:
          type: integer
        status:
          type: string
          enum: [draft, active, paused]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        media:
          type: array
          items:
            type: object
            properties:
              file_path:
                type: string
              media_type:
                type: string

    # ----- SPONSORED AD -----
    SponsoredAdInput:
      type: object
      required:
        - title
        - media_type
        - pricing_tier
        - sponsor_duration
        - payment_method
        - currency
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        media_type:
          type: string
          enum: [video, image]
        external_url:
          type: string
          format: uri
          maxLength: 2048
        property_id:
          type: integer
        pricing_tier:
          type: string
          enum: [basic, standard, premium]
        sponsor_duration:
          type: string
          enum: [days_7, days_14, days_30]
        payment_method:
          type: string
          enum: [stripe, balance]
        currency:
          type: string
          enum: [usd, sar, aed]
        idempotency_key:
          type: string
          maxLength: 255
        media:
          type: array
          items:
            type: string
            format: binary

    # ----- REVIEW -----
    ReviewInput:
      type: object
      required: [reviewed_id, rating]
      properties:
        reviewed_id:
          type: integer
          description: ID of the office/publisher being reviewed
        property_id:
          type: integer
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    # ----- PLAN -----
    PlanInput:
      type: object
      required: [name, slug, price, duration_days]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
        currency:
          type: string
          default: usd
        duration_days:
          type: integer
          description: Subscription duration in days (e.g. 30)
        is_active:
          type: boolean
          default: true
        sort_order:
          type: integer
        publisher_type:
          type: string
          enum: [individual, office]

    # ----- ACCOUNT (LEDGER) -----
    AccountInput:
      type: object
      required: [code, name, type, account_category]
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [user_balance, revenue, clearing, platform_fee, liability, expense]
        account_category:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        parent_id:
          type: integer
          nullable: true
        description:
          type: string
        currency:
          type: string
        is_active:
          type: boolean
        sort_order:
          type: integer

    # ----- PAGINATION -----
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: integer
        to:
          type: integer

    # ----- ERROR -----
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # ----- SUCCESS -----
    SuccessResponse:
      type: object
      properties:
        data:
          nullable: true
        message:
          type: string

